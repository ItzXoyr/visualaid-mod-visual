name: Build mod

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fabric Loom 1.19.x richiede JDK 25 per ESEGUIRE Gradle/il plugin.
      # Il bytecode della mod resta comunque compilato per Java 21
      # (vedi "tasks.withType(JavaCompile) { options.release = 21 }" in
      # build.gradle), quindi il jar risultante gira lo stesso con Java 21,
      # come quella installata insieme a Minecraft.
      - name: Set up JDK 25 (to run Gradle/Loom)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          set +e
          gradle build --stacktrace 2>&1 | tee build-output.log
          code=${PIPESTATUS[0]}
          echo "$code" > build-exit-code.txt
          exit "$code"
        shell: bash

      - name: Dump method signatures for first-person render classes
        if: always()
        continue-on-error: true
        run: |
          set +e +o pipefail
          echo "Searching for named minecraft jar..." > method-dump.txt
          named_jar=""
          for f in $(find ~/.gradle -iname "*.jar" 2>/dev/null); do
            if unzip -l "$f" 2>/dev/null | grep -q "net/minecraft/client/render/item/HeldItemRenderer.class"; then
              named_jar="$f"
              break
            fi
          done
          echo "Using jar: $named_jar" >> method-dump.txt
          if [ -n "$named_jar" ]; then
            echo "=== HeldItemRenderer ===" >> method-dump.txt
            javap -p -l -classpath "$named_jar" net.minecraft.client.render.item.HeldItemRenderer >> method-dump.txt 2>&1
            echo "=== GameRenderer ===" >> method-dump.txt
            javap -p -l -classpath "$named_jar" net.minecraft.client.render.GameRenderer >> method-dump.txt 2>&1
          else
            echo "No named minecraft jar found" >> method-dump.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add method-dump.txt
          git commit -m "ci: dump method signatures [skip ci]"
          git push
          exit 0
        shell: bash

      - name: Commit build log on failure
        if: failure()
        run: |
          {
            echo "--- lines mentioning error/exception/caused by ---"
            grep -n -iE "error|exception|caused by|failed to|could not" build-output.log || true
            echo "--- full tail (400 lines) ---"
            tail -n 400 build-output.log
          } > last-build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-build-error.log
          git commit -m "ci: record build failure log [skip ci]"
          git push
        shell: bash

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: visualaid-mod
          path: build/libs/*.jar

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
