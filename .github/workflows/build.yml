name: Build mod

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          set +e
          gradle build --stacktrace 2>&1 | tee build-output.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### Gradle build failed"
              echo '```'
              tail -n 100 build-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
        shell: bash

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: visualaid-mod
          path: build/libs/*.jar

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
