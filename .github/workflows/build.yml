name: Build mod

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: List available fabric-loom plugin versions
        run: |
          curl -s "https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml" \
            > loom-versions.xml || true
          cat loom-versions.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add loom-versions.xml
          git commit -m "ci: list available fabric-loom versions [skip ci]" || echo "nothing to commit"
          git push || echo "push failed, continuing"
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Fabric Loom 1.7.x non e' compatibile con Gradle 9+ (API Problems
          # cambiata). Si pinna una Gradle 8.x nota per funzionare con Loom.
          gradle-version: '8.10'

      - name: Build with Gradle
        run: |
          set +e
          gradle build --stacktrace 2>&1 | tee build-output.log
          code=${PIPESTATUS[0]}
          echo "$code" > build-exit-code.txt
          exit "$code"
        shell: bash

      - name: Commit build log on failure
        if: failure()
        run: |
          {
            grep -n -E "error:|\.java:[0-9]+:" build-output.log || true
            echo "--- tail ---"
            tail -n 60 build-output.log
          } > last-build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-build-error.log
          git commit -m "ci: record build failure log [skip ci]"
          git push
        shell: bash

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: visualaid-mod
          path: build/libs/*.jar

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
